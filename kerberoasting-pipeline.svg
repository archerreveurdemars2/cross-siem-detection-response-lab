<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 710" role="img" aria-label="Pipeline Kerberoasting : Kali demande des tickets de service au DC, Splunk détecte l'événement 4769 et l'envoie à Sentinel, une règle d'analytique ouvre un incident qui déclenche une automation rule, un Logic App et un runbook Azure Automation qui réinitialise, depuis le DC lui-même, le mot de passe du compte de service ciblé." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1040" height="710" fill="#ffffff"/>

  <text x="520" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Pipeline de détection et réponse — Kerberoasting</text>

  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#15803d"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">

    <!-- ===== Top row : attaque -> détection ===== -->

    <!-- B1 Kali -->
    <rect x="20" y="70" width="150" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="99" text-anchor="middle" font-size="13" font-weight="600">Kali Linux</text>
    <text x="95" y="116" text-anchor="middle" font-size="11" fill="#475569">(attaquant)</text>

    <!-- B2 DC (pivot node, mis en évidence) -->
    <rect x="250" y="70" width="210" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="355" y="99" text-anchor="middle" font-size="13" font-weight="600">DC — WIN-UFUVI4HLPLO</text>
    <text x="355" y="116" text-anchor="middle" font-size="11" fill="#7c4a03">Event 4769 (TGS request)</text>

    <!-- B3 Splunk -->
    <rect x="530" y="70" width="190" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="99" text-anchor="middle" font-size="13" font-weight="600">Splunk</text>
    <text x="625" y="116" text-anchor="middle" font-size="11" fill="#475569">recherche planifiée /5min</text>

    <!-- B4 Sentinel table -->
    <rect x="790" y="70" width="230" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="905" y="99" text-anchor="middle" font-size="13" font-weight="600">Microsoft Sentinel</text>
    <text x="905" y="116" text-anchor="middle" font-size="11" fill="#475569">table SplunkAlerts_CL</text>

    <!-- Arrows top row -->
    <line x1="170" y1="105" x2="246" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <text x="210" y="58" text-anchor="middle" font-size="11" fill="#334155">GetUserSPNs — TGS RC4 (0x17)</text>

    <line x1="460" y1="105" x2="526" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <text x="495" y="58" text-anchor="middle" font-size="11" fill="#334155">Forwarder → Event 4769</text>

    <line x1="720" y1="105" x2="786" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <text x="755" y="58" text-anchor="middle" font-size="11" fill="#334155">send_to_sentinel.py (API)</text>

    <!-- ===== Right column : détection -> incident ===== -->

    <!-- B5 Analytics rule -->
    <rect x="790" y="230" width="230" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="905" y="259" text-anchor="middle" font-size="13" font-weight="600">Règle d'analytique</text>
    <text x="905" y="276" text-anchor="middle" font-size="11" fill="#475569">(KQL sur SplunkAlerts_CL)</text>

    <!-- B6 Incident -->
    <rect x="790" y="390" width="230" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="905" y="419" text-anchor="middle" font-size="13" font-weight="600">Incident Sentinel</text>
    <text x="905" y="436" text-anchor="middle" font-size="11" fill="#475569">Kerberoasting</text>

    <line x1="905" y1="140" x2="905" y2="226" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <text x="920" y="188" text-anchor="start" font-size="11" fill="#334155">toutes les 5-15 min</text>

    <line x1="905" y1="300" x2="905" y2="386" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <text x="920" y="348" text-anchor="start" font-size="11" fill="#334155">incident créé</text>

    <!-- ===== Bottom row : réponse automatisée (retour vers le DC) ===== -->

    <!-- B7 Automation rule + Logic App -->
    <rect x="470" y="550" width="290" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="615" y="579" text-anchor="middle" font-size="13" font-weight="600">Automation rule</text>
    <text x="615" y="596" text-anchor="middle" font-size="11" fill="#475569">→ Logic App (playbook)</text>

    <!-- B8 Runbook -->
    <rect x="150" y="550" width="270" height="70" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
    <text x="285" y="579" text-anchor="middle" font-size="13" font-weight="600">Runbook Azure Automation</text>
    <text x="285" y="596" text-anchor="middle" font-size="11" fill="#475569">(Hybrid Worker, exécuté sur le DC)</text>

    <!-- Incident -> Automation rule (coude) -->
    <polyline points="905,460 905,585 764,585" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="830" y="571" text-anchor="middle" font-size="11" fill="#15803d">automation rule déclenchée</text>

    <!-- Automation rule -> Runbook -->
    <line x1="470" y1="585" x2="424" y2="585" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="445" y="571" text-anchor="middle" font-size="10" fill="#15803d">déclenche</text>

    <!-- Runbook -> DC (boucle de fermeture : la réponse revient au DC) -->
    <line x1="285" y1="550" x2="285" y2="144" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <rect x="295" y="330" width="215" height="34" fill="#ffffff" opacity="0.9"/>
    <text x="295" y="342" text-anchor="start" font-size="11" fill="#15803d">Set-ADAccountPassword -Reset</text>
    <text x="295" y="357" text-anchor="start" font-size="11" fill="#15803d">(compte svc-sql)</text>

  </g>

  <!-- Légende -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">
    <line x1="330" y1="680" x2="365" y2="680" stroke="#334155" stroke-width="2"/>
    <text x="373" y="684">Détection</text>

    <line x1="470" y1="680" x2="505" y2="680" stroke="#15803d" stroke-width="2"/>
    <text x="513" y="684" fill="#15803d">Réponse automatisée</text>
  </g>
</svg>
